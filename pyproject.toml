[project]
name = "mem-align"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub==1.29.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "timm==1.0.29",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.70.0",
    "transformers>=5.0.0",
    "wandb==0.29.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "lets-plot>=4.11.0",
    "matplotlib>=3.10.7",
    "modal>=1.5.5",
    "polars>=1.43.2",
]

# This machine's NVIDIA driver is 570.86.15 == CUDA 12.8. Default PyPI torch
# wheels are CUDA 13 builds and abort with "driver is too old", so pin torch
# to PyTorch's cu128 index to match the driver exactly.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
